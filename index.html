<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Magic Surprise</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Fredoka+One&display=swap');

        body {
            font-family: 'Fredoka One', cursive;
            background: linear-gradient(135deg, #ff758c, #ff4081, #8b0032);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #ffffff;
            text-align: center;
            overflow: hidden;
        }

        .characters {
            font-size: 5rem;
            animation: bounce 2s infinite ease-in-out;
            margin-bottom: 10px;
        }

        .character {
            display: inline-block;
            animation: wave 2s infinite;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 4.5rem;
            margin: 10px 0;
            color: #fff0f5;
            text-shadow: 0 0 20px #ff0055, 0 0 40px #ff0055;
        }

        .sticker-container {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .sticker {
            position: absolute;
            font-size: 3rem;
            animation: floatUp 6s linear infinite;
        }

        .btn {
            background: #ffffff;
            color: #ff0055;
            padding: 20px 40px;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.5rem;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s;
            z-index: 10;
        }

        .btn:hover {
            transform: scale(1.1);
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes wave {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-20deg); }
        }

        @keyframes floatUp {
            0% { transform: translateY(105vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-5vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="sticker-container">
        <div class="sticker" style="left: 10%; animation-duration: 5s;">🌷</div>
        <div class="sticker" style="left: 25%; animation-duration: 7s;">🌸</div>
        <div class="sticker" style="left: 55%; animation-duration: 4s;">🌺</div>
        <div class="sticker" style="left: 75%; animation-duration: 6s;">🌷</div>
        <div class="sticker" style="left: 90%; animation-duration: 5.5s;">💐</div>
    </div>

    <div class="characters">
        <span class="character">🧸</span>
        <span>✨</span>
        <span class="character" style="animation-delay: 0.5s;">🎈</span>
    </div>

    <h1>Happy Birthday! 💖</h1>
    
    <br>
    <a href="#" class="btn" onclick="alert('🎉 जन्मदिन की ढेर सारी खुशियाँ! आप हमेशा चमकते रहें! 🌸✨')">Tap for Magic!</a>
</body>
</html>
